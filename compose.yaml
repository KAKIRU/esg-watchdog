services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - esg-watchdog-pgdata:/var/lib/postgresql/data

volumes:
  esg-watchdog-pgdata: