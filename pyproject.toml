[project]
name = "esg-watchdog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.82",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
esg-watchdog = "esg_watchdog:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
